name: Update Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            --no-install-recommends \
            bash git curl zip unzip jq aria2
          url="https://api.github.com/repos/${{ github.repository }}-Updater/contents"
          for file in .gitconfig release.sh; do
            curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
             -H "Accept: application/vnd.github.v3.raw" -L "$url/$file" -o "$file"
            [[ -f "$file" ]] || \
            { echo "Error: Failed to download $file"; exit 1; }
          done
          chmod +x release.sh
          
  update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [m, v]
    steps:   
      - name: Source Release Script
        run: source release.sh ${{ matrix.os }} 1
      - name: Create Release
        id: create_release
        uses: comnoco/create-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false

      - name: Push Changes
        if: env.CHANGED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Magisk Modules"
          file_pattern: "zee_*/*.json"
          push_options: "--force"
          skip_dirty_check: true
          skip_fetch: true
