name: Update Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            --no-install-recommends \
            git curl zip unzip jq aria2  
      - name: Get and Run Release Script
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}-Updater/main"
          for file in .gitconfig release.sh; do
            curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
             -H "Accept: application/vnd.github.v3.raw" -L "$url/$file" -o "$file"
            [[ -f "$file" ]] || \
            { echo "Error: Failed to download $file"; exit 1; }
          done
          chmod +x release.sh
          source release.sh 1

      - name: Push Changes
        if: env.CHANGED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Magisk Modules"
          file_pattern: "zee_/*.json"
          push_options: "--force"
          skip_dirty_check: true
          skip_fetch: true
