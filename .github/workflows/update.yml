name: Update Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # - name: Update And Install Packages
      #   run: |
      #     sudo apt-get update -y
      #     sudo apt-get install -y \
      #       --no-install-recommends \
      #       bash git curl zip unzip jq aria2
            
      - name: Get Release Script and Run
        shell: bash
        run: |
          url="https://api.github.com/repos/${{ github.repository }}-Updater/contents"
          
          for file in .gitconfig release.sh; do
            curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
             -H "Accept: application/vnd.github.v3.raw" -L "$url/$file" -o "$file"
             
            [[ -f "$file" ]] || \
            { echo "Error: Failed to download $file"; exit 1; }
          done
          
          chmod +x release.sh
          bash release.sh ${{ github.repository_owner }} 1

          echo "Before: $CHANGED"
          echo "CHANGED=${CHANGED:-false}" >> $GITHUB_ENV
          echo "After: $CHANGED"

