name: Update Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            --no-install-recommends \
            bash git curl zip unzip jq aria2
          url="https://raw.githubusercontent.com/${{ github.repository }}-Updater/main"
          for file in .gitconfig release.sh; do
            curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
             -H "Accept: application/vnd.github.v3.raw" -L "$url/$file" -o "$file"
            [[ -f "$file" ]] || \
            { echo "Error: Failed to download $file"; exit 1; }
          done
          chmod +x release.sh
          
  update:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        os: [m, v]
    steps:   
      - name: Source Release Script
        shell: bash
        run: source release.sh ${{ matrix.os }} 1

      - name: Push Changes
        if: env.CHANGED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ${{ env.APP }} Magisk Modules"
          file_pattern: "${{ env.FOLDER }}/*.json"
          push_options: "--force"
          skip_dirty_check: true
          skip_fetch: true
