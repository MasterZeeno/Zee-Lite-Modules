name: Update Releases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update And Install Packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            --no-install-recommends \
            git curl zip unzip jq aria2
            
      - name: Get Release Script and Run
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}-Updater/main"
          
          for file in .gitignore release.sh; do
            curl -L -o "$file" "$url/$file"
            [[ -f release.sh ]] || \
            { echo "Error: Failed to download $file"; exit 1; }
          done
          
          chmod +x release.sh
          source release.sh
          
          echo "CHANGED=${CHANGED:-false}"
          echo "CHANGED=${CHANGED:-false}" >> $GITHUB_ENV

      - name: Debug CHANGED value
        run: echo "CHANGED=${{ env.CHANGED }}"

      - name: Push Changes
        if: env.CHANGED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Magisk Modules"
          file_pattern: "zee_*/*.json"
          push_options: "--force"
          skip_dirty_check: true
          skip_fetch: true
